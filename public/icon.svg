<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Konsulent Tycoon app icon: a pixel briefcase next to a rising chart. -->
  <rect width="32" height="32" fill="#14122b"/>
  <rect x="0" y="23" width="32" height="9" fill="#1c1a3a"/>
  <!-- rising chart -->
  <rect x="21" y="18" width="2" height="5" fill="#48d597"/>
  <rect x="24" y="14" width="2" height="9" fill="#48d597"/>
  <rect x="27" y="9" width="2" height="14" fill="#48d597"/>
  <!-- handle -->
  <rect x="8" y="9" width="7" height="2" fill="#c25e00"/>
  <rect x="8" y="11" width="2" height="2" fill="#c25e00"/>
  <rect x="13" y="11" width="2" height="2" fill="#c25e00"/>
  <!-- case -->
  <rect x="3" y="13" width="17" height="10" fill="#ff9e2c"/>
  <rect x="3" y="13" width="17" height="1" fill="#ffc06b"/>
  <rect x="3" y="17" width="17" height="1" fill="#c25e00"/>
  <rect x="3" y="22" width="17" height="1" fill="#c25e00"/>
  <!-- clasp -->
  <rect x="10" y="16" width="3" height="3" fill="#ffd84d"/>
  <rect x="11" y="17" width="1" height="1" fill="#c25e00"/>
</svg>
