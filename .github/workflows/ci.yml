name: CI

# Pull requests: typecheck, lint, test and build the app and the Cloud Functions.
# Merge to main: the same checks, then one deploy job that ships Firebase first and Vercel right after.
# They must go out together: the leaderboard server only accepts games from its own ENGINE_VERSION,
# which is a hash of src/engine and src/content (docs/utvikling.md, "Toppliste (Firebase)").
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions are pinned to a commit and the deploy CLIs to an exact version: the deploy job holds the Google Cloud
# login and the Vercel token, so a hijacked release of any of them must not get to run there unnoticed.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run functions:build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never two production deploys at once, and never cancel one halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # keyless login to Google Cloud (Workload Identity Federation)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Functions first: once the new app is live, its games must find a server that accepts them.
      # firebase.json's predeploy builds the functions bundle. --force skips the prompts CI can't answer.
      - name: Deploy Firebase (functions, Firestore rules and indexes)
        run: npx --yes firebase-tools@15.31.0 deploy --only functions,firestore --project konsulent-tycoon --non-interactive --force

      - name: Deploy the app to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@60.0.1 deploy --prod --yes --token "$VERCEL_TOKEN"
